name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run shipped verification paths including Verilog
        run: python verify_all.py --with-verilog
      - name: Run optional Verilog path directly
        run: python verify_verilog.py
      - name: Run software-only verification paths
        run: python verify_all.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
